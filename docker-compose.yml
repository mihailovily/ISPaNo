services:
  intraservice-bot:
    profiles: ["bot"]
    build: { context: ., dockerfile: Dockerfile }
    image: intraservice-bot:latest
    restart: unless-stopped
    init: true
    env_file: [.env]
    environment: { PYTHONUNBUFFERED: "1", OUTPUT_DIR: /app/exports }
    command: ["poetry", "run", "python", "-m", "ispano", "bot"]
    volumes: ["./exports:/app/exports:rw", "./.local:/app/.local:ro"]
  intraservice-web:
    profiles: ["web"]
    build: { context: ., dockerfile: Dockerfile }
    image: intraservice-bot:latest
    restart: unless-stopped
    init: true
    env_file: [.env]
    environment: { PYTHONUNBUFFERED: "1", OUTPUT_DIR: /app/exports, WEB_HOST: 0.0.0.0 }
    command: ["poetry", "run", "python", "-m", "ispano", "web"]
    ports: ["${WEB_PORT:-8000}:${WEB_PORT:-8000}"]
    volumes: ["./exports:/app/exports:rw", "./.local:/app/.local:ro"]
