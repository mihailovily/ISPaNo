<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ISPaNo — вход</title><style>body{font-family:Segoe UI,sans-serif;background:#f4f7f6;margin:0;display:grid;min-height:100vh;place-items:center}main{background:#fff;padding:2rem;border-radius:10px;box-shadow:0 2px 12px #0002;width:min(22rem,85vw)}label,input,button{display:block;width:100%;box-sizing:border-box;margin:.5rem 0}input,button{padding:.7rem}button{background:#1769aa;color:#fff;border:0;border-radius:4px;cursor:pointer}.error{color:#a22;min-height:1.4rem}</style></head><body><main><h1>ISPaNo</h1><p>Войдите для работы с выгрузками.</p><form id="login"><label>Имя пользователя<input id="username" autocomplete="username" required></label><label>Пароль<input id="password" type="password" autocomplete="current-password" required></label><button>Войти</button></form><p id="error" class="error"></p></main><script>document.getElementById('login').addEventListener('submit',async(event)=>{event.preventDefault();const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});if(response.ok)location.assign('/');else error.textContent=(await response.json()).detail||'Не удалось войти.'});</script></body></html>
