<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ISPaNo — выгрузки</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Основная навигация">
      <a class="brand" href="/">ISPaNo</a>
      <nav><ul class="nav-list"><li><a class="nav-item" href="/" aria-current="page">Выгрузки</a></li></ul></nav>
      <div class="sidebar__footer"><span id="user" class="user-name" aria-label="Текущий пользователь"></span><button id="logout" class="button button--secondary" type="button" disabled>Выйти</button></div>
    </aside>
    <main class="workspace">
      <header class="mobile-bar"><a class="brand" href="/">ISPaNo</a><button id="mobile-logout" class="button button--secondary" type="button" disabled>Выйти</button></header>
      <header class="page-header"><h1 id="page-title" class="page-title">Выгрузки</h1></header>
      <section class="panel exports-panel" aria-label="Создание выгрузок">
        <section class="export-row" aria-labelledby="json-title">
          <header class="panel__header"><h2 id="json-title" class="panel__title">JSON</h2></header>
          <form id="json-form" class="form-stack">
            <div class="field"><label class="field__label" for="since">Изменены после</label><input id="since" class="input" type="datetime-local" required></div>
            <button class="button button--primary" type="submit" disabled>Создать JSON</button>
          </form>
          <div id="json-status" class="job-status" aria-live="polite" aria-atomic="true"></div>
        </section>
        <section class="export-row" aria-labelledby="report-title">
          <header class="panel__header"><h2 id="report-title" class="panel__title">XLSX</h2></header>
          <form id="report-form" class="form-stack">
            <div class="field"><label class="field__label" for="ticket-id">Нижняя граница ID</label><input id="ticket-id" class="input" type="number" min="1" inputmode="numeric" required></div>
            <label id="ai-row" class="choice hidden" for="use-ai"><input id="use-ai" type="checkbox">Использовать ИИ-суммаризацию</label>
            <button class="button button--primary" type="submit" disabled>Создать XLSX</button>
          </form>
          <div id="report-status" class="job-status" aria-live="polite" aria-atomic="true"></div>
        </section>
        <section class="export-row" aria-labelledby="local-title">
          <header class="panel__header"><h2 id="local-title" class="panel__title">Открыть JSON</h2></header>
          <div class="local-layout"><div><input id="local-json" class="file-input" type="file" accept="application/json,.json"><label class="file-dropzone" for="local-json"><span class="file-dropzone__title" id="local-file-title">Выбрать файл</span></label></div><button id="open-local" class="button button--secondary" type="button" disabled>Открыть</button></div>
          <div id="local-status" class="job-status" aria-live="polite" aria-atomic="true"></div>
        </section>
      </section>
    </main>
  </div>
</body>
</html>
