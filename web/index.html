<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ISPaNo</title><style>:root{font-family:Segoe UI,sans-serif;color:#263238}body{margin:0;background:#f4f7f6}.container{max-width:900px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}section{background:#fff;border-radius:8px;padding:20px;margin:18px 0;box-shadow:0 2px 8px #0000000d}label,input,button{margin:.4rem 0}input{padding:.55rem;max-width:20rem;width:100%;box-sizing:border-box}button{padding:.6rem .85rem;border:0;border-radius:4px;background:#1769aa;color:white;cursor:pointer}.secondary{background:#546e7a}.status{white-space:pre-wrap;background:#f6f8fa;padding:.75rem;min-height:1.4rem}.hidden{display:none}</style></head><body><main class="container"><header><div><h1>ISPaNo</h1><span id="user"></span></div><button id="logout" class="secondary">Выйти</button></header><section><h2>JSON-выгрузка</h2><p>Получите тикеты и их переписки, затем скачайте JSON или откройте viewer.</p><form id="json-form"><label>Изменены после<br><input id="since" placeholder="03.09.2026 14:30" required></label><br><button>Создать JSON</button></form><div id="json-status" class="status"></div></section><section><h2>Табличный отчёт</h2><p>Выгружает заявки от самого свежего номера до указанного включительно.</p><form id="report-form"><label>Нижняя граница ID<br><input id="ticket-id" type="number" min="1" required></label><label id="ai-row" class="hidden"><input id="use-ai" type="checkbox"> Использовать ИИ-суммаризацию</label><br><button>Создать XLSX</button></form><div id="report-status" class="status"></div></section><section><h2>Локальный JSON v2</h2><p>Выберите ранее созданный файл: он будет прочитан только вашим браузером.</p><input id="local-json" type="file" accept="application/json,.json"><button id="open-local" type="button">Открыть viewer</button></section></main><script>
let csrf='';async function api(url,options={}){const headers={...(options.headers||{})};if(options.method&&options.method!=='GET')headers['X-CSRF-Token']=csrf;const response=await fetch(url,{...options,headers});if(response.status===401)location.assign('/login');if(!response.ok)throw Error((await response.json()).detail||'Ошибка запроса');return response.json()}async function watch(job,node){for(;;){const state=await api(`/api/jobs/${job.id}`);node.textContent=[state.status,...state.progress,state.error||''].filter(Boolean).join('\n');if(state.status==='succeeded'){const links=document.createElement('p');links.innerHTML=`<a href="${state.download_url}">Скачать результат</a>${state.viewer_url?` · <a href="${state.viewer_url}">Открыть переписки</a>`:'';node.append(links);return}if(state.status==='failed')return;await new Promise(resolve=>setTimeout(resolve,1000))}}async function submit(event,url,body,target){event.preventDefault();const node=document.getElementById(target);node.textContent='Задание поставлено в очередь…';try{watch(await api(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),node)}catch(error){node.textContent=error.message}}(async()=>{try{const session=await api('/api/session');csrf=session.csrf;document.getElementById('user').textContent=session.username;if(session.ai_enabled)document.getElementById('ai-row').classList.remove('hidden')}catch(error){location.assign('/login')}})();document.getElementById('json-form').addEventListener('submit',event=>submit(event,'/api/jobs/json',{since:document.getElementById('since').value},'json-status'));document.getElementById('report-form').addEventListener('submit',event=>submit(event,'/api/jobs/report',{ticket_id:Number(document.getElementById('ticket-id').value),use_ai:document.getElementById('use-ai').checked},'report-status'));document.getElementById('logout').addEventListener('click',async()=>{await api('/api/logout',{method:'POST'});location.assign('/login')});document.getElementById('open-local').addEventListener('click',()=>{const file=document.getElementById('local-json').files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{sessionStorage.setItem('ispano-local-json',reader.result);location.assign('/viewer?local=1')};reader.readAsText(file)});
</script></body></html>
