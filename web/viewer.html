<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ISPaNo — переписки</title><style>:root{font-family:Segoe UI,sans-serif;color:#263238}body{margin:0;padding:24px;background:#f4f7f6}.container{max-width:1000px;margin:auto}.ticket{margin:0 0 15px;background:#fff;border-radius:8px;box-shadow:0 2px 8px #0000000d}.ticket-header{display:flex;width:100%;text-align:left;justify-content:space-between;gap:16px;align-items:center;padding:15px 20px;background:#ecf0f1;border:0;border-left:4px solid #3498db;cursor:pointer}.ticket-body{display:none;padding:20px}.ticket.open .ticket-body{display:block}.chat-msg{margin:12px 0;padding:12px;border:1px solid #e1e8ed;border-left:4px solid #2ecc71;border-radius:6px}.chat-text,.ticket-desc{white-space:pre-wrap}.meta{color:#607d8b;font-size:.9em}.error{background:#fff;padding:16px}</style></head><body><main class="container"><p><a href="/">← К заданиям</a></p><h1>Тикеты и переписки</h1><div id="app" class="error">Загрузка…</div></main><script>
const app=document.getElementById('app'),e=(tag,text,cls)=>{const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined&&text!==null)node.textContent=String(text);return node};function comment(c){const n=e('article',null,'chat-msg');n.append(e('div',`${c.author||'Неизвестный автор'} · ${c.date_raw||c.occurred_at||''}`,'meta'),e('div',c.text||'','chat-text'));if(Array.isArray(c.events))c.events.forEach(x=>n.append(e('div',x,'meta')));return n}function ticket(t){const card=e('article',null,'ticket'),head=e('button',`#${t.id??''} — ${t.name||'Без названия'}`,'ticket-header'),body=e('div',null,'ticket-body');head.type='button';body.append(e('div',t.description||'Описание отсутствует.','ticket-desc'),e('h2','История'));if(Array.isArray(t.chat)&&t.chat.length)t.chat.forEach(c=>body.append(comment(c)));else body.append(e('p','Нет сообщений в чате.'));head.onclick=()=>card.classList.toggle('open');card.append(head,body);return card}function render(data){if(!data||data.schema_version!==2||!Array.isArray(data.tickets))throw Error('Файл не является экспортом формата v2.');app.replaceChildren();if(!data.tickets.length)app.append(e('p','Тикетов нет.'));data.tickets.forEach(t=>app.append(ticket(t)))}(async()=>{try{const p=new URLSearchParams(location.search);let data;if(p.get('local'))data=JSON.parse(sessionStorage.getItem('ispano-local-json')||'');else if(p.get('job')){const r=await fetch(`/api/jobs/${p.get('job')}/download`);if(!r.ok)throw Error(`HTTP ${r.status}`);data=await r.json()}else throw Error('Не указан источник JSON.');render(data)}catch(err){app.textContent=`Не удалось загрузить выгрузку: ${err.message}`}})();
</script></body></html>
